services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: palm-mind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7
    container_name: palm-mind-redis
    ports:
      - "6379:6379"

volumes:
  qdrant_storage: